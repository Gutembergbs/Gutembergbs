  <path d="M526 173c-17 42-82 65-147 94-59 26-99 49-126 78" fill="none" stroke="#ff5264" stroke-width="9"/>
  <path d="M604 173c11 36 50 59 105 85 60 28 99 53 127 87" fill="none" stroke="#f4f0dc" stroke-width="8"/>
  <path d="M492 178h216v16H492z" fill="url(#checks)" stroke="#fff" stroke-width="2"/>
