<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Retro Road Racer</title>
  <desc id="description">Capa de um jogo de corrida arcade com estrada curva, carro e linha de chegada.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#081525"/>
      <stop offset="1" stop-color="#15506b"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#343b44"/>
      <stop offset="1" stop-color="#161d28"/>
    </linearGradient>
    <linearGradient id="car" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#146ca4"/>
      <stop offset=".5" stop-color="#63d5ff"/>
      <stop offset="1" stop-color="#15527c"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="checks" width="28" height="18" patternUnits="userSpaceOnUse">
      <path d="M0 0h14v9H0zm14 9h14v9H14z" fill="#fff"/>
    </pattern>
  </defs>
